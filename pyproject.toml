[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-exchangerate"
version = "0.1.0"
description = "ECB and cryptocurrency historical rates with EUR cross-conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "requests>=2.32,<3.0", "openpyxl>=3.1,<4.0"]

[project.scripts]
crypto-exchangerate = "crypto_exchangerate.cli:main"

[tool.setuptools]
packages = ["crypto_exchangerate"]
include-package-data = false

[tool.setuptools.package-data]
crypto_exchangerate = ["assets.json", "data/*.csv"]
