[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OfflineCurrencyCoverter"
version = "0.1.0"
description = "ECB and cryptocurrency historical rates with EUR cross-conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "requests>=2.32,<3.0", "openpyxl>=3.1,<4.0"]

[project.scripts]
offline-currency-coverter = "offline_currency_coverter.cli:main"

[tool.setuptools]
packages = ["offline_currency_coverter"]
include-package-data = false

[tool.setuptools.package-data]
offline_currency_coverter = ["assets.json", "data/*.csv"]
