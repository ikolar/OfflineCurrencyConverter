name: Publish Python package to PyPI

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update ECB + crypto rates"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    # Only publish code from the repository's default branch.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-release.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Restore ECB downloads
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .cache/ecb
          key: ecb-zip-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ecb-zip-v1-${{ runner.os }}-

      - name: Download the successful update's snapshot
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: rates-snapshot
          path: downloaded-snapshot/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build and validate the updated snapshot
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          snapshots=(downloaded-snapshot/*.csv)
          [[ ${#snapshots[@]} -eq 1 && -f "${snapshots[0]}" ]]
          python publish_package.py --snapshot "${snapshots[0]}"

      - name: Fetch fresh rates, build and validate distributions
        if: github.event_name == 'workflow_dispatch'
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python publish_package.py

      - name: Save checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/*/*.whl
            dist/*/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/OfflineCurrencyConverter/
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: downloaded-dist/

      - name: Collect distributions
        run: |
          mkdir publish-dist
          find downloaded-dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} publish-dist/ \;

      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          skip-existing: true
